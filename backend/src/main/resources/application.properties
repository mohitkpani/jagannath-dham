spring.application.name=jagannath-dham-backend

# Server Configuration
server.port=${PORT:8080}
server.address=0.0.0.0

# TiDB Cloud MySQL Database
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Application Information
management.info.env.enabled=true
info.app.name=Jagannath Dham
info.app.description=Darshan Booking and Odisha Tourism Platform
info.app.version=1.0.0
info.app.developer=Mohit Kumar Pani

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=1800000

# Razorpay Configuration
razorpay.key.id=${RAZORPAY_KEY_ID}
razorpay.key.secret=${RAZORPAY_KEY_SECRET}

# SendLiberty API Configuration
sendliberty.api.url=https://sendliberty.com/api/send
sendliberty.api.key=${SENDLIBERTY_API_KEY}

# SendLiberty Sender Configuration
sendliberty.from=Jagannath Dham <mytechlabs.tech@gmail.com>
support.email=mytechlabs.tech@gmail.com

# OpenWeatherMap Configuration
openweathermap.api.key=${OPENWEATHERMAP_API_KEY}
openweathermap.api.url=https://api.openweathermap.org/data/2.5/weather

# Gemini AI Configuration
gemini.api.key=${GEMINI_API_KEY}
gemini.model=gemini-3.5-flash-lite

# Cloudinary Configuration
cloudinary.cloud-name=tdjuabqh
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# File Upload Configuration
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=3MB

app.email.banner-url=${EMAIL_BANNER_URL:}